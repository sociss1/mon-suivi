<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04110B">
<meta name="color-scheme" content="dark">
<meta name="description" content="Suivi personnel : journée, habitudes, budget en FCFA et projets, avec un coach qui te dit quoi corriger.">
<meta property="og:title" content="Mon Suivi">
<meta property="og:description" content="Suivi personnel : journée, habitudes, budget en FCFA et projets, avec un coach qui te dit quoi corriger.">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon Suivi">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mon Suivi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Figtree:wght@400..700&display=swap">
<style>
/* Layout: same single column and tabs. Look: deep green night, frosted liquid-glass panels, one bright mint hero per tab, pressable 3D buttons, floating glass tab pill. Deliberately one dark look. */
:root{
  color-scheme:dark;
  --bg:#04110B;
  --ink:#EAFBF1;
  --muted:#90BAA4;
  --line:rgba(255,255,255,.09);
  --edge:rgba(255,255,255,.15);
  --edge-hi:rgba(255,255,255,.34);
  --glass:linear-gradient(150deg,rgba(255,255,255,.14),rgba(255,255,255,.04) 55%,rgba(255,255,255,.08));
  --glass-sh:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -18px 30px -22px rgba(0,0,0,.55),0 24px 44px -26px rgba(0,0,0,.9);
  --mint:#86FFA2;
  --mint-hi:#B9FFCB;
  --on-mint:#03210F;
  --sun:#FFC24D;
  --good:#6BF0A0;
  --bad:#FF8C7A;
  --gold:#F5B82E;
  --accent:var(--mint);
  --accent-soft:rgba(134,255,162,.16);
  --orb:#2BD66B;
  --c-jour:#6BF0A0;--c-hab:#FF9A62;--c-bud:#74B4FF;--c-proj:#B79BFF;
  --f-display:'Plus Jakarta Sans','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Avenir Next','Segoe UI',system-ui,sans-serif;
}
body[data-tab="jour"]{--orb:#2BD66B}
body[data-tab="hab"]{--orb:#FF7A3D}
body[data-tab="bud"]{--orb:#3D8BFF}
body[data-tab="proj"]{--orb:#8B5CFF}
body[data-tab="coach"]{--orb:#FFB020}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
#main{perspective:1100px}

.ambient{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;background:radial-gradient(95% 55% at 50% -10%,rgba(70,210,120,.42),transparent 70%),radial-gradient(70% 45% at 100% 100%,rgba(20,130,75,.32),transparent 70%)}
.amb{position:absolute;border-radius:50%;background-color:var(--orb);filter:blur(80px);opacity:.34}
.amb.a{width:320px;height:320px;top:90px;right:-140px}
.amb.b{width:300px;height:300px;bottom:60px;left:-150px;opacity:.24}
.wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;padding-block:14px 132px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{display:flex;flex-direction:column;gap:16px;margin-bottom:18px}
.bar-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hello{min-width:0}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink);text-align:left}
.brand .lg{width:44px;height:44px;flex:none;filter:drop-shadow(0 10px 14px rgba(50,220,110,.38))}
.brand .wm{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.03em}
.brand em{font-style:normal;color:var(--mint)}
.welcome{position:fixed;inset:0;z-index:60;display:grid;place-items:center;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:radial-gradient(80% 50% at 50% 0%,rgba(70,210,120,.38),transparent 70%),rgba(2,12,8,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.wcard{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;text-align:center;padding:28px 22px 22px;border-radius:32px;background:var(--glass);border:1px solid var(--edge);box-shadow:var(--glass-sh)}
.wcard h2{font-size:25px;margin:0}
.wcard .sub{margin:0}
.wlogo{width:132px;height:132px;margin:0 auto;filter:drop-shadow(0 22px 30px rgba(50,230,120,.5))}
.wlogo svg{width:100%;height:100%;display:block}
@media (prefers-reduced-motion:no-preference){
  .wlogo{animation:spin3d 6s ease-in-out infinite}
  .wcard{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
  .brand:active .lg{transform:scale(.92)}
  .brand .lg{transition:transform .2s}
  @keyframes spin3d{0%,100%{transform:perspective(600px) rotateY(-16deg) rotateX(4deg) translateY(0)}50%{transform:perspective(600px) rotateY(16deg) rotateX(-3deg) translateY(-8px)}}
}
.kicker{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:var(--f-display);font-size:32px;line-height:1.08;margin:4px 0 0;font-weight:800;letter-spacing:-.03em;text-wrap:balance}
.nm{color:var(--mint)}
@supports (-webkit-background-clip:text) or (background-clip:text){
  .nm{background:linear-gradient(90deg,#B9FFCB,#6BF0A0 60%,#F5E08A);-webkit-background-clip:text;background-clip:text;color:transparent}
}
h2{font-family:var(--f-display);font-size:19px;line-height:1.2;margin:0 0 4px;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;padding-top:3px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--good);box-shadow:0 0 10px var(--good)}.dot.saving{background:var(--sun)}.dot.err{background:var(--bad)}
.sec{margin-top:28px}
.sub{color:var(--muted);font-size:14px;margin:0 0 10px}
.sm{font-size:13px;color:var(--muted)}

/* hero: bright mint liquid card */
.hero{position:relative;overflow:hidden;color:var(--on-mint);border-radius:30px;padding:20px;
  background:
    radial-gradient(circle at 50% 50%,rgba(255,255,255,.78),rgba(255,255,255,0) 62%) 0 0/70% 110% no-repeat,
    radial-gradient(circle at 50% 50%,rgba(20,170,80,.55),rgba(20,170,80,0) 66%) 100% 100%/80% 90% no-repeat,
    linear-gradient(145deg,#A6FFBB 0%,#69EE8C 48%,#3FD06F 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -14px 26px -10px rgba(0,110,45,.45),0 34px 60px -26px rgba(90,255,150,.6),0 8px 0 -4px rgba(10,90,40,.25);
  transition:rotate .25s ease-out}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.55) 50%,transparent 62%);transform:translateX(-130%);pointer-events:none}
.hero::after{content:"";position:absolute;top:-38px;right:-34px;width:118px;height:118px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 30% 26%,#fff 0,rgba(255,255,255,.85) 7%,rgba(200,255,215,.4) 30%,rgba(40,170,90,.3) 72%,rgba(0,90,35,.4) 100%);
  box-shadow:inset -10px -14px 22px rgba(0,100,40,.42),inset 8px 8px 16px rgba(255,255,255,.75),0 20px 30px -12px rgba(0,80,30,.55)}
.hero>*{position:relative;z-index:1}
.hero .sm{color:rgba(3,33,15,.74)}
.rh{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.ring{position:relative;width:98px;height:98px;filter:drop-shadow(0 8px 10px rgba(0,90,35,.35))}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rt{fill:none;stroke:rgba(3,33,15,.16);stroke-width:9}
.rf{fill:none;stroke:#03210F;stroke-width:9;stroke-linecap:round;stroke-dasharray:264}
.rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.rc b{font-family:var(--f-display);font-size:25px;font-weight:800;font-variant-numeric:tabular-nums}
.rc span{font-size:11px;opacity:.8}
.hs{display:flex;flex-direction:column;gap:5px;font-size:15px;min-width:0}
.hs b{font-family:var(--f-display);font-size:19px;font-weight:800;margin-right:6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hh{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hh b{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:36px;line-height:1.05;font-variant-numeric:tabular-nums}
.hh .u{font-size:18px;opacity:.8}
.ph{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pst{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px;border:0;border-radius:18px;background:rgba(3,33,15,.88);color:var(--mint-hi);cursor:pointer;min-height:70px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 16px -10px rgba(0,60,25,.8)}
.pst b{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1.05}
.pst span{font-size:12px;font-weight:600}
.pst[aria-pressed="true"]{background:#F4FFF8;color:var(--on-mint);box-shadow:inset 0 -3px 0 rgba(0,100,40,.2),0 12px 18px -10px rgba(0,60,25,.7)}
.reste{font-family:var(--f-display);font-size:42px;line-height:1.05;font-weight:800;letter-spacing:-.035em;font-variant-numeric:tabular-nums;margin:2px 0 12px;overflow-wrap:anywhere}
.warn{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;padding:5px 12px;border-radius:99px;background:rgba(3,33,15,.88);color:#FFB7A9}

/* liquid glass surfaces */
.panel,.card,.habit,.proj{position:relative;isolation:isolate;background:var(--glass);border:1px solid var(--edge);border-radius:24px;backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);box-shadow:var(--glass-sh)}
.panel::before,.card::before,.habit::before,.proj::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;background:radial-gradient(90% 70% at 0% 0%,rgba(255,255,255,.17),transparent 60%),linear-gradient(180deg,rgba(255,255,255,.05),transparent 30%)}
.panel{padding:2px 16px}
.card{padding:16px}
.habit{padding:16px}
.proj{padding:14px 16px}
.panel .row:last-child{border-bottom:0}
ul.list{list-style:none;margin:0;padding:0}
ul.cards{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.row .grow.done{color:var(--muted);text-decoration:line-through}
.chk{width:32px;height:32px;border-radius:12px;border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.2);flex:none;display:grid;place-items:center;cursor:pointer;color:var(--on-mint);padding:0;box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}
.chk svg{opacity:0}
.chk[aria-pressed="true"]{background:linear-gradient(180deg,#B2FFC6,#5EEA86);border-color:transparent;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.8),0 0 16px rgba(110,255,160,.55)}
.chk[aria-pressed="true"] svg{opacity:1}
.x{background:none;border:0;color:var(--muted);width:38px;height:38px;border-radius:12px;cursor:pointer;display:grid;place-items:center;flex:none;padding:0}
.x:hover{background:rgba(255,255,255,.08)}
.empty{padding:14px 0;color:var(--muted);font-size:15px}

.in{width:100%;min-height:48px;padding:10px 14px;border-radius:16px;border:1px solid var(--edge);background:rgba(0,0,0,.3);color:var(--ink);font-size:16px;box-shadow:inset 0 2px 8px rgba(0,0,0,.45)}
textarea.in{min-height:96px;resize:vertical}
.in::placeholder{color:var(--muted);opacity:.8}
.in:focus{border-color:var(--mint)}
.add{display:flex;gap:8px;margin-top:12px}
.btn{min-height:48px;padding:10px 20px;border:0;border-radius:999px;background:linear-gradient(180deg,#B2FFC6 0%,#72F193 55%,#49D874 100%);color:var(--on-mint);font-weight:800;cursor:pointer;white-space:nowrap;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.8),0 4px 0 #1C8D47,0 16px 24px -10px rgba(70,235,125,.55)}
.btn.ghost{background:rgba(255,255,255,.09);color:var(--ink);font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 0 0 1px var(--edge)}
.link{background:none;border:0;padding:8px 4px;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--bad);font-weight:700}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:13px;color:var(--muted);font-weight:600}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form{display:flex;flex-direction:column;gap:12px}
.in.big{font-size:24px;font-family:var(--f-display);font-weight:800}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.07);cursor:pointer;font-size:15px;display:inline-flex;align-items:center;gap:7px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,#B2FFC6,#5EEA86);border-color:transparent;color:var(--on-mint);font-weight:700;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.8),0 0 18px rgba(110,255,160,.45)}
.chip .sm{color:inherit;opacity:.8}
.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.moods .chip{justify-content:center;padding:8px 2px;font-size:14px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:14px}
.wk{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:76px;font-size:11px;color:var(--muted)}
.wk i{display:block;width:100%;max-width:26px;border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,#B2FFC6,#3FCB6C);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 12px rgba(90,240,140,.35)}
.wk i.none{background:var(--line);box-shadow:none;height:3px!important}
.wk.today{color:var(--ink);font-weight:700}

.habit-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.habit-head b{font-family:var(--f-display);font-size:18px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.streak{display:flex;align-items:center;gap:5px;color:var(--sun);font-weight:700;font-size:14px;white-space:nowrap}
.flame{display:inline-flex;transform-origin:50% 90%}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.d{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:2px 0;color:var(--muted);font-size:11px;cursor:pointer}
.d i{display:block;width:100%;max-width:40px;aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.26);background:rgba(0,0,0,.2);box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}
.d[aria-pressed="true"] i{background:radial-gradient(circle at 35% 28%,#E2FFE9,#69EE8C 45%,#32C262);border-color:transparent;box-shadow:inset 0 -3px 5px rgba(0,100,40,.4),0 0 14px rgba(100,255,150,.55)}
.d.today{color:var(--ink);font-weight:700}
.d.today i{outline:2px solid var(--edge-hi);outline-offset:3px}
.habit-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}

.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.monthbar b{font-family:var(--f-display);font-size:19px;font-weight:800;text-transform:capitalize}
.sq{width:46px;height:46px;border-radius:16px;border:1px solid var(--edge);background:var(--glass);cursor:pointer;display:grid;place-items:center;padding:0;box-shadow:var(--glass-sh);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.sq:disabled{opacity:.35;cursor:default}
.bar{height:10px;border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.bar>b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4FDC7B,#A6FFBB);box-shadow:0 0 12px rgba(110,255,160,.55)}
.hero .bar{background:rgba(3,33,15,.2);height:12px;box-shadow:inset 0 1px 3px rgba(0,60,25,.4)}
.hero .bar>b{background:#03210F;box-shadow:none}
.hero .bar>b.over{background:#8A1C0C}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted);margin-top:10px;font-variant-numeric:tabular-nums}
.kv b{color:var(--ink);font-weight:600}
.hero .kv{color:rgba(3,33,15,.74)}
.hero .kv b{color:var(--on-mint);font-weight:800}
.income{display:flex;align-items:center;gap:8px;margin-top:14px}
.income label{font-size:13px;color:rgba(3,33,15,.8);font-weight:700;flex:none}
.income .in{min-height:42px;text-align:right;font-variant-numeric:tabular-nums}
.hero .in{background:rgba(3,33,15,.9);color:#EAFBF1;border-color:transparent;box-shadow:none}
.seg2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:rgba(0,0,0,.3);border-radius:999px;padding:4px;box-shadow:inset 0 2px 6px rgba(0,0,0,.45)}
.seg2 button{min-height:42px;border:0;border-radius:999px;background:transparent;cursor:pointer;font-weight:700;font-size:14px;padding:6px 2px;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:linear-gradient(180deg,#B2FFC6,#5EEA86);color:var(--on-mint);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.8),0 6px 14px -6px rgba(70,235,125,.6)}
.cat{padding:8px 0}
.cat-top{display:flex;justify-content:space-between;gap:12px;font-size:15px;font-variant-numeric:tabular-nums}
.cat .bar{height:8px;margin-top:6px}
.tx{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tx .amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.tx .amt.rev{color:var(--good)}
.tx .meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tx .act{text-align:right}

.proj-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.proj-head b{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.proj-next{font-size:14px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.pill{font-size:12px;font-weight:700;padding:4px 11px;border-radius:99px;background:var(--accent-soft);color:var(--mint-hi);border:1px solid rgba(134,255,162,.3);white-space:nowrap;flex:none}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--sun);border:1px solid var(--sun);border-radius:6px;padding:1px 6px;margin-left:8px;vertical-align:2px}
.edit{display:flex;flex-direction:column;gap:12px;margin-top:14px}

/* coach */
.top-r{display:flex;align-items:center;gap:10px;flex:none}
.bell{position:relative;width:46px;height:46px;border-radius:50%;border:1px solid var(--edge);background:var(--glass);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:var(--glass-sh);color:var(--ink);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.bell svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transform-origin:50% 10%}
.badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 5px;border-radius:99px;background:#FF5A44;color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg);box-shadow:0 0 12px rgba(255,90,68,.6)}
.grp{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.cnt{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:rgba(255,255,255,.1);font-variant-numeric:tabular-nums}

/* floating glass tab pill */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;padding:0 max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(14px,env(safe-area-inset-left,0px))}

/* bottom bar: slide to choose, hide while scrolling down */
.nav-in{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.nav.hide{transform:translateY(calc(100% + 30px));opacity:0;visibility:hidden}

  main.anim>*:nth-child(5){--n:4}main.anim>*:nth-child(6){--n:5}main.anim>*:nth-child(7){--n:6}main.anim>*:nth-child(8){--n:7}
  main.anim .list>li,main.anim .cards>li,main.anim .cat,main.anim .chips>*,main.anim .ins,main.anim ol.steps li{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(220ms + var(--j,0)*55ms)}

  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

<script>
(function(){
'use strict';
var main=document.getElementById('main');
var REDUCED=false;
try{REDUCED=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)}
function pad(n){return String(n).padStart(2,'0')}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function mk(s){return s.slice(0,7)}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ds(d)}
function T(){return ds(new Date())}
var HIDE=(function(){try{return localStorage.getItem('suivi:hide')==='1'}catch(e){return false}})();
function fmt(n){return HIDE?'•••• F':Math.round(n).toLocaleString('fr-FR')+' F'}
function num(v){return parseInt(String(v).replace(/[^\d]/g,''),10)||0}
function clone(o){return JSON.parse(JSON.stringify(o))}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function J(i){return ' style="--j:'+i+'"'}

var CATS_DEP=['Transport','Nourriture','Crédit & data','Loyer & charges','Famille','Santé','Loisirs','Marchandises','Épargne','Autre'];
var CATS_REV=['Client','Autre revenu'];
var STAGES=['Idée','Prépa','En cours','Lancé'];
var STOCK_ST=['Commandé','En route','Reçu'];
var MOODS=['Dur','Bof','Ça va','Bien','Top'];
var WD=['D','L','M','M','J','V','S'];
var TABS=['jour','hab','bud','proj','coach'];

var ICON_CHECK='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var ICON_X='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function flame(sz){return '<span class="flame"><svg viewBox="0 0 24 24" width="'+sz+'" height="'+sz+'" fill="currentColor" aria-hidden="true"><path d="M12 2.5c.7 3.5-3.2 5.5-4.3 8.6-1.2 3.2.4 7 4 7.7-1.6-1.3-1.8-3.5-.6-5 .3 1.8 1.6 2.5 2.6 2.3 1.2-.3 1.5-1.6 1.2-2.9 1.8 1.5 2.8 3.2 2.5 5A6.6 6.6 0 0 1 12 21.5a6.8 6.8 0 0 1-6.8-6.8c0-4.9 5.3-7.2 6.8-12.2z"/></svg></span>'}
var ICON_CHEV_L='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg>';
var ICON_CHEV_R='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg>';

/* ---------- data ---------- */
function defApp(){
  return {v:1,income:0,goal:{n:'',t:0,s:0},
    habits:[
      {id:uid(),n:'Sport 30 min',log:{}},
      {id:uid(),n:'Lecture 20 min',log:{}},
      {id:uid(),n:'Eau (2 litres)',log:{}},
      {id:uid(),n:'Au lit avant minuit',log:{}}
    ],
    projects:[
      {id:uid(),n:'Ma boutique en ligne',note:'Une boutique à moi. Choisir une niche qui se vend bien près de chez moi.',next:'Lister 3 produits possibles et comparer les prix fournisseurs',stage:0,s:1},
      {id:uid(),n:'Un service à proposer à mes clients',note:'Une offre claire avec un prix, pour gagner un revenu en plus.',next:'Écrire l\'offre en 3 phrases et fixer le prix',stage:0,s:1},
      {id:uid(),n:'Revente par WhatsApp avec livraison',note:'Un seul produit au départ, commandes par WhatsApp, livraison dans Dakar.',next:'Choisir le produit et fixer un prix de revente',stage:0,s:1},
      {id:uid(),n:'Contenu sur Instagram et TikTok',note:'Montrer mon travail pour attirer de nouveaux clients.',next:'Planifier 6 publications',stage:0,s:1},
      {id:uid(),n:'Mini-formation en ligne',note:'Un atelier payant pour débutants sur ce que je sais faire.',next:'Écrire le plan en 4 séances',stage:0,s:1}
    ]};
}
var DOCS={},dirty=new Set(),localHad={};
var remote=null,syncState='local',timer=null,flushing=false,toastTimer=null;
var SAMPLE,DIAG=null,notified=false,lastAlerts=-1;

function lsGet(k){try{var v=localStorage.getItem('suivi:'+k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem('suivi:'+k,JSON.stringify(v))}catch(e){}}
function load(key){
  if(DOCS[key])return DOCS[key];
  var l=lsGet(key);
  if(l){localHad[key]=1;DOCS[key]=l}
  else DOCS[key]=key==='app'?defApp():{days:{},tx:[]};
  return DOCS[key];
}
function A(){return load('app')}
function M(k){return load('m-'+k)}
function touch(key){lsSet(key,DOCS[key]);dirty.add(key);schedule();cdSchedule()}

function setSync(s){
  syncState=s;
  var el=document.getElementById('sync');
  var map={ok:['ok','Enregistré'],saving:['saving','Enregistrement…'],local:['','Sur cet appareil'],err:['err','Pas enregistré en ligne']};
  var m=map[s]||map.local;
  el.title=m[1];
  el.innerHTML='<span class="dot '+m[0]+'"></span><span>'+m[1]+'</span>';
}
function schedule(){
  clearTimeout(timer);
  if(remote)setSync('saving');
  timer=setTimeout(flush,600);
}
async function flush(){
  if(flushing||!dirty.size)return;
  if(!remote){dirty.clear();setSync('local');return}
  flushing=true;
  var failed=false;
  while(dirty.size){
    var key=dirty.values().next().value;
    dirty.delete(key);
    try{
      await remote.db.doc(remote.base+'/'+key).set(clone(DOCS[key]));
    }catch(e){
      if(e&&e.code==='invalid_argument'){remote=null;dirty.clear();flushing=false;setSync('local');return}dirty.add(key);failed=true;break;
    }
  }
  flushing=false;
  if(failed){setSync('err');clearTimeout(timer);timer=setTimeout(flush,10000)}
  else setSync('ok');
}
async function pull(key){
  if(!remote||dirty.has(key))return false;
  try{
    var s=await remote.db.doc(remote.base+'/'+key).get();
    if(s.exists){
      var d=clone(s.data());
      if(JSON.stringify(d)!==JSON.stringify(DOCS[key])){DOCS[key]=d;lsSet(key,d);return true}
      return false;
    }
    if(localHad[key]){dirty.add(key);schedule()}
  }catch(e){}
  return false;
}
async function connect(){
  try{
    if(!window.claude||!window.claude.use){SAMPLE=aiShim();setSync('local');if(ui.tab==='coach')render(false);return}
    var res=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    var db=res[0],user=res[1];
    try{SAMPLE=await window.claude.use('sample')}catch(e){SAMPLE=null}
    if(SAMPLE===undefined)SAMPLE=null;
    if(ui.tab==='coach')render(false);
    var id=user?await user.id():null;
    if(!db||!id){setSync('local');return}
    remote={db:db,base:'data/users/'+id};
    setSync('ok');
    var changed=false,keys=Object.keys(DOCS);
    for(var i=0;i<keys.length;i++){if(await pull(keys[i]))changed=true}
    if(changed)render(false);
  }catch(e){if(SAMPLE===undefined)SAMPLE=null;setSync('local')}
}
document.addEventListener('visibilitychange',async function(){
  if(document.visibilityState!=='visible'||!remote||dirty.size||flushing)return;
  var ae=document.activeElement;
  if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT'))return;
  var changed=false,keys=Object.keys(DOCS);
  for(var i=0;i<keys.length;i++){if(await pull(keys[i]))changed=true}
  if(changed)render(false);
});

/* ---------- effects ---------- */
function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.classList.remove('show')},2200);
}
function burstAt(x,y,n){
  if(REDUCED||!document.body.animate)return;
  var cs=getComputedStyle(document.documentElement);
  var cols=['--c-jour','--c-hab','--c-bud','--c-proj'].map(function(k){return cs.getPropertyValue(k).trim()||'#0B7A58'});
  cols.push('#F5B82E');
  for(var i=0;i<n;i++){
    var s=document.createElement('span'),size=6+Math.random()*6;
    s.style.cssText='position:fixed;left:'+x+'px;top:'+y+'px;width:'+size+'px;height:'+(size*(Math.random()>.5?1:.45))+'px;background:'+cols[i%cols.length]+';border-radius:2px;pointer-events:none;z-index:60';
    document.body.appendChild(s);
    var a=Math.random()*Math.PI*2,dist=40+Math.random()*(n>20?160:70);
    var dx=Math.cos(a)*dist,dy=Math.sin(a)*dist-30;
    var an=s.animate([
      {transform:'translate(-50%,-50%) rotate(0deg)',opacity:1},
      {transform:'translate(calc(-50% + '+dx+'px),calc(-50% + '+(dy+70)+'px)) rotate('+Math.round(Math.random()*540-270)+'deg)',opacity:0}
    ],{duration:700+Math.random()*600,easing:'cubic-bezier(.15,.7,.3,1)',fill:'forwards'});
    an.onfinish=(function(el){return function(){el.remove()}})(s);
  }
}
function burstFrom(r,n){burstAt(r.left+r.width/2,r.top+r.height/2,n)}
function countUp(){
  if(REDUCED)return;
  Array.prototype.forEach.call(main.querySelectorAll('[data-count]'),function(el){
    var to=Number(el.dataset.count),f=el.dataset.f,t0=null,dur=950;
    function fm(v){return f==='f'?fmt(v):f==='p'?Math.round(v)+' %':String(Math.round(v))}
    el.textContent=fm(0);
    function step(ts){
      if(t0===null)t0=ts;
      var p=Math.min(1,(ts-t0)/dur),e=1-Math.pow(1-p,3);
      el.textContent=fm(to*e);
      if(p<1)requestAnimationFrame(step);else el.textContent=fm(to);
    }
    requestAnimationFrame(step);
  });
}

/* ---------- state helpers ---------- */
var ui={tab:'jour',viewMonth:mk(T()),open:null,opening:null,confirm:null,pf:0,txType:'dep',focus:null,pop:null,fresh:null,ringPct:0,coachPct:0,aiBusy:false,aiErr:'',ctl:null};
try{var hh=(location.hash||'').replace('#','');if(TABS.indexOf(hh)>-1)ui.tab=hh}catch(e){}

function day(date,create){
  var m=M(mk(date));
  if(!m.days[date]){if(!create)return null;m.days[date]={tasks:[],note:'',mood:0}}
  return m.days[date];
}
function streak(h){
  var d=T(),n=0;
  if(!h.log[d])d=addDays(d,-1);
  while(h.log[d]){n++;d=addDays(d,-1)}
  return n;
}
function toggleHabit(id,date){
  var h=A().habits.find(function(x){return x.id===id});
  if(!h)return false;
  if(h.log[date])delete h.log[date];else h.log[date]=1;
  touch('app');
  return !!h.log[date];
}
function sum(arr){return arr.reduce(function(s,x){return s+x.a},0)}
function dayPct(){
  var t=T(),d=day(t),tk=d?d.tasks:[],hs=A().habits,tot=tk.length+hs.length;
  if(!tot)return 0;
  var dn=tk.filter(function(x){return x.d}).length+hs.filter(function(h){return h.log[t]}).length;
  return Math.round(dn/tot*100);
}
function popc(key){return ui.pop===key?' pop':''}
function frc(key){return ui.fresh===key?' fresh':''}

/* ---------- views ---------- */
function viewJour(){
  var t=T(),d=day(t)||{tasks:[],note:'',mood:0};
  var done=d.tasks.filter(function(x){return x.d}).length;
  var hs=A().habits,hdone=hs.filter(function(h){return h.log[t]}).length;
  var spent=sum(M(mk(t)).tx.filter(function(x){return x.d===t&&x.k==='dep'}));
  var yd=day(addDays(t,-1));
  var carry=yd?yd.tasks.filter(function(x){return !x.d&&!x.c}):[];
  var tot=d.tasks.length+hs.length,pct=dayPct(),C=264;
  var off=C*(1-pct/100),from=C*(1-ui.ringPct/100);
  ui.ringPct=pct;
  var msg=!tot?'Ajoute tes priorités pour commencer.':pct===100?'Journée complète. Bravo !':'Il reste '+(tot-done-hdone)+' à faire aujourd\'hui.';

  var hero='<div class="hero"><div class="rh"><div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="rt" cx="50" cy="50" r="42"/><circle class="rf" cx="50" cy="50" r="42" style="stroke-dashoffset:'+off+';--from:'+from+'"/></svg>'+
    '<div class="rc"><b data-count="'+pct+'" data-f="p">'+pct+' %</b><span>de ta journée</span></div></div>'+
    '<div class="hs"><div><b>'+done+'/'+d.tasks.length+'</b>priorités</div><div><b>'+hdone+'/'+hs.length+'</b>habitudes</div>'+
    '<div><b data-count="'+spent+'" data-f="f">'+fmt(spent)+'</b>dépensé</div><div class="sm">'+msg+'</div></div></div></div>';

  var tasks=d.tasks.map(function(x,i){
    return '<li class="row'+frc('task:'+x.id)+'"'+J(i)+'><button type="button" class="chk'+popc('task:'+x.id)+'" data-act="task" data-id="'+x.id+'" aria-pressed="'+(x.d?'true':'false')+'" aria-label="Terminé : '+esc(x.t)+'">'+ICON_CHECK+'</button>'+
      '<span class="grow'+(x.d?' done':'')+'">'+esc(x.t)+'</span>'+
      '<button type="button" class="x" data-act="taskdel" data-id="'+x.id+'" aria-label="Supprimer : '+esc(x.t)+'">'+ICON_X+'</button></li>';
  }).join('');

  var chips=hs.length?hs.map(function(h,i){
    var st=streak(h);
    return '<button type="button" class="chip'+popc('hchip:'+h.id)+'"'+J(i)+' data-act="hchip" data-id="'+h.id+'" aria-pressed="'+(h.log[t]?'true':'false')+'">'+esc(h.n)+(st>1?' <span class="sm">'+st+' j</span>':'')+'</button>';
  }).join(''):'<div class="empty">Ajoute une habitude dans l\'onglet Habitudes.</div>';

  var moods=MOODS.map(function(l,i){
    return '<button type="button" class="chip'+popc('mood:'+(i+1))+'" data-act="mood" data-v="'+(i+1)+'" aria-pressed="'+(d.mood===i+1?'true':'false')+'">'+l+'</button>';
  }).join('');
  var wk='';
  for(var i=6;i>=0;i--){
    var dt=addDays(t,-i),rec=day(dt),mood=rec?rec.mood:0;
    wk+='<div class="wk'+(i===0?' today':'')+'"><i class="'+(mood?'':'none')+'" style="--j:'+(6-i)+';height:'+(mood?(mood*12+8):3)+'px" title="'+(mood?MOODS[mood-1]:'Pas de note')+'"></i><span>'+WD[parse(dt).getDay()]+'</span></div>';
  }

  return hero+
    '<section class="sec"><h2>Priorités du jour</h2>'+
    '<p class="sub">Les choses qui comptent le plus aujourd\'hui.</p>'+
    (d.tasks.length?'<div class="panel"><ul class="list">'+tasks+'</ul></div>':'<div class="empty">Rien pour l\'instant. Note les 3 choses à finir aujourd\'hui.</div>')+
    (carry.length?'<button type="button" class="btn ghost" style="margin-top:12px" data-act="carry">Reprendre '+carry.length+' tâche'+(carry.length>1?'s':'')+' d\'hier</button>':'')+
    '<form class="add" data-form="task"><input class="in" id="task-input" placeholder="Ajouter une priorité" autocomplete="off" aria-label="Nouvelle priorité"><button class="btn" type="submit">Ajouter</button></form></section>'+

    '<section class="sec"><h2>Habitudes du jour</h2><div class="chips" style="margin-top:10px">'+chips+'</div></section>'+

    '<section class="sec"><h2>Comment ça va ?</h2><div class="moods" style="margin-top:10px">'+moods+'</div><div class="week" aria-label="Humeur des 7 derniers jours">'+wk+'</div></section>'+

    '<section class="sec"><h2>Ce soir</h2><p class="sub">Ce que j\'ai accompli aujourd\'hui.</p>'+
    '<textarea class="in" id="note" data-in="note" placeholder="Une ligne suffit." aria-label="Note du soir">'+esc(d.note)+'</textarea></section>';
}

function viewHab(){
  var t=T(),hs=A().habits;
  var best=0,hdone=0;
  hs.forEach(function(h){best=Math.max(best,streak(h));if(h.log[t])hdone++});
  var hero='<div class="hero"><div class="hh">'+
    '<div><b>'+flame(30)+'<span data-count="'+best+'" data-f="n">'+best+'</span><span class="u">j</span></b><span class="sm">meilleure série</span></div>'+
    '<div><b><span data-count="'+hdone+'" data-f="n">'+hdone+'</span><span class="u">/ '+hs.length+'</span></b><span class="sm">faites aujourd\'hui</span></div></div></div>';

  var rows=hs.map(function(h,hi){

      days+='<button type="button" class="d'+(i===0?' today':'')+popc('hday:'+h.id+dt)+'" data-act="hday" data-id="'+h.id+'" data-date="'+dt+'" aria-pressed="'+(on?'true':'false')+'" aria-label="'+esc(h.n)+', '+lab+'"><span>'+WD[parse(dt).getDay()]+'</span><i></i></button>';
    }
    var cf=ui.confirm==='hdel:'+h.id;
    return '<li class="habit'+frc('habit:'+h.id)+'"'+J(hi)+'><div class="habit-head"><b>'+esc(h.n)+'</b>'+
      '<span class="streak">'+(st>0?flame(15)+st+' j de suite':'<span class="sm" style="font-weight:500">Pas de série</span>')+'</span></div>'+
      '<div class="days">'+days+'</div>'+
      '<div class="habit-foot"><span class="sm">'+Math.round(r30/30*100)+' % sur 30 jours</span>'+
      '<button type="button" class="link'+(cf?' danger':'')+'" data-act="hdel" data-id="'+h.id+'">'+(cf?'Confirmer la suppression':'Supprimer')+'</button></div></li>';
  }).join('');
  return hero+'<section class="sec"><h2>Mes habitudes</h2><p class="sub">Touche un cercle pour cocher un jour, même un jour passé.</p>'+
    (hs.length?'<ul class="cards">'+rows+'</ul>':'<div class="empty">Aucune habitude. Ajoute la première ci-dessous.</div>')+
    '<form class="add" data-form="habit"><input class="in" id="habit-input" placeholder="Nouvelle habitude" autocomplete="off" aria-label="Nouvelle habitude"><button class="btn" type="submit">Ajouter</button></form></section>';
}

function catOptions(){
  return (ui.txType==='rev'?CATS_REV:CATS_DEP).map(function(c){return '<option>'+esc(c)+'</option>'}).join('');
}
function viewBud(){
  var key=ui.viewMonth,m=M(key),a=A(),now=mk(T());
  var inc=(m.inc!=null)?m.inc:a.income;
  var rec=sum(m.tx.filter(function(x){return x.k==='rev'}));
  var depTx=m.tx.filter(function(x){return x.k==='dep'});

  var perDay='';
  if(key===now&&reste>0){
    var n=new Date(),last=new Date(n.getFullYear(),n.getMonth()+1,0).getDate(),left=last-n.getDate()+1;
    perDay='Environ '+fmt(reste/left)+' par jour pendant '+left+' jour'+(left>1?'s':'');
  }
  var byCat={};depTx.forEach(function(x){byCat[x.c]=(byCat[x.c]||0)+x.a});

  var catHtml=cats.length?'<div class="panel" style="margin-top:8px">'+cats.map(function(c,i){
    return '<div class="cat"'+J(i)+'><div class="cat-top"><span>'+esc(c)+'</span><span>'+fmt(byCat[c])+'</span></div><div class="bar"><b style="width:'+(byCat[c]/maxc*100)+'%"></b></div></div>';
  }).join('')+'</div>':'<div class="empty">Pas encore de dépense ce mois-ci.</div>';

  var list=m.tx.slice().sort(function(p,q){return p.d<q.d?1:p.d>q.d?-1:0}).slice(0,25);

function S(){var a=A();return a.stock||(a.stock=[])}
function sc(x){
  var q=Math.max(1,x.q||1),total=(x.q||0)*(x.u||0)+(x.f||0),unit=total/q,sold=Math.min(x.sold||0,q),p=x.p||0;
  return {total:total,unit:unit,sold:sold,left:q-sold,p:p,margin:p-unit,mpct:p>0?(p-unit)/p:0,rev:sold*p,profit:sold*(p-unit),frozen:(q-sold)*unit};
}
function stockTotals(){
  var t={inv:0,rev:0,profit:0,frozen:0,n:0};
  S().forEach(function(x){var c=sc(x);t.inv+=c.total;t.rev+=c.rev;t.profit+=c.profit;t.frozen+=c.frozen;t.n++});

}

/* ---------- coach: automatic diagnosis (no AI cost) ---------- */
function pctS(x){return Math.round(x*100)+' %'}
function diagnose(){
  var t=T(),now=new Date(),key=mk(t),m=M(key),a=A(),g=a.goal;
  var inc=(m.inc!=null)?m.inc:a.income;
  var rec=sum(m.tx.filter(function(x){return x.k==='rev'}));
  var base=Math.max(inc,rec);
  var depTx=m.tx.filter(function(x){return x.k==='dep'});
  var dep=sum(depTx);
  var dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),dn=now.getDate();
  var left=dim-dn+1,reste=base-dep;
  var byCat={};depTx.forEach(function(x){byCat[x.c]=(byCat[x.c]||0)+x.a});
  var items=[];
  function add(l,ti,d){items.push({l:l,t:ti,d:d})}

  /* argent: rythme */
  if(base<=0){
    add('info','Indique ton revenu du mois','Sans revenu, je ne peux pas juger tes dépenses. Renseigne-le dans l\'onglet Budget.');
  }else if(dep>base){
    add('bad','Tu dépenses plus que ce que tu gagnes ce mois-ci','Dépensé '+fmt(dep)+' pour un revenu de '+fmt(base)+'. Ce n\'est pas normal. Coupe les dépenses non essentielles jusqu\'à la fin du mois.');
  }else if(dn>=5&&dep>0){
    var proj=dep/dn*dim;
    if(proj>base)add('warn','Ton rythme de dépenses est trop rapide','À ce rythme tu atteindras environ '+fmt(proj)+' ce mois, soit '+fmt(proj-base)+' de plus que ton revenu. Il te reste '+fmt(reste)+' pour '+left+' jour'+(left>1?'s':'')+', soit '+fmt(reste/left)+' par jour.');
    else add('ok','Ton rythme de dépenses est normal','Dépensé '+fmt(dep)+' sur '+fmt(base)+' ('+pctS(dep/base)+') au jour '+dn+' sur '+dim+'. Tu peux dépenser environ '+fmt(reste/left)+' par jour jusqu\'à la fin du mois.');
  }
  if(base>0&&dep===0&&dn>3)add('info','Aucune dépense notée ce mois-ci','Si tu as dépensé de l\'argent, note-le dans Budget pour que mes conseils soient justes.');
  if(depTx.length){
    var last=depTx.reduce(function(mx,x){return x.d>mx?x.d:mx},'');
    var since=Math.round((parse(t)-parse(last))/864e5);
    if(since>=3)add('info','Aucune dépense notée depuis '+since+' jours','Un oubli ou vraiment rien dépensé ? Note chaque dépense le jour même, même les petites.');
  }

  /* argent: catégories */
  var lim={'Loisirs':[.15,'Loisirs'],'Crédit & data':[.08,'Crédit et data'],'Transport':[.15,'Transport'],'Nourriture':[.35,'Nourriture'],'Autre':[.15,'Dépenses classées Autre']};
  if(base>0){
    Object.keys(lim).forEach(function(c){
      var v=byCat[c]||0;
      if(v>base*lim[c][0])add('warn',lim[c][1]+' : '+pctS(v/base)+' de ton revenu',fmt(v)+' ce mois-ci. Repère habituel : pas plus de '+pctS(lim[c][0])+', soit '+fmt(base*lim[c][0])+'.'+(c==='Autre'?' Range ces dépenses dans de vraies catégories pour mieux voir où part l\'argent.':''));
    });
  }

  /* argent: épargne */
  var ep=byCat['Épargne']||0,target=base*.15;
  if(base>0){
    if(ep>=target)add('ok','Tu épargnes assez ce mois-ci','Tu as mis '+fmt(ep)+' de côté, au-dessus du repère de '+fmt(target)+' (15 % du revenu).');
    else if(dn>=15)add('warn','Tu n\'épargnes pas assez ce mois-ci','Mis de côté : '+fmt(ep)+'. Repère : '+fmt(target)+' (15 % du revenu). Vire un petit montant dès aujourd\'hui, pas ce qui reste à la fin.');
    else add('info','Épargne à prévoir : '+fmt(target),'Repère : 15 % de ton revenu. Mets-le de côté dès que l\'argent rentre, puis dépense le reste.');
  }
  if(g.t>0){
    var rem=g.t-g.s;
    if(rem<=0)add('ok','Objectif d\'épargne atteint','« '+(g.n||'Mon objectif')+' » : '+fmt(g.s)+' sur '+fmt(g.t)+'. Fixe-en un nouveau.');
    else if(target>0){
      var mo=Math.ceil(rem/target);
      add(mo>18?'warn':'info','Objectif « '+(g.n||'Mon objectif')+' » : '+pctS(g.s/g.t),'Il manque '+fmt(rem)+'. En mettant '+fmt(target)+' de côté par mois, tu l\'atteins en environ '+mo+' mois.'+(mo>18?' C\'est long. Augmente le montant mensuel ou baisse l\'objectif.':''));
    }
  }else add('info','Fixe un objectif d\'épargne chiffré','Un objectif sans montant ne se suit pas. Ajoute-le en bas de l\'onglet Budget.');
  if(base>0)add('info','Si ton revenu varie, prévois sur le bas','Calcule ton budget sur le montant le plus bas que tu peux recevoir. Quand tu gagnes plus, mets la différence dans l\'épargne ou dans un projet.');

  /* import Chine */
  var stk=(a.stock||[]);
  if(stk.length){
    var tt=stockTotals(),lowM=[],noP=[],slow=[];
    stk.forEach(function(x){
      var c=sc(x);
      if(!x.p)noP.push(x.n);
      else if(c.mpct<.25)lowM.push(x.n+' ('+pctS(c.mpct)+')');
      if(x.st===2&&c.sold===0&&x.d&&Math.round((parse(t)-parse(x.d))/864e5)>=14)slow.push(x.n);
    });
    if(lowM.length)add('warn','Marge trop faible : '+lowM.slice(0,2).join(', '),'Après transport et douane, il reste moins de 25 % du prix de vente. Vise au moins 30 %, sinon monte le prix ou négocie le prix d\'achat.');
    if(noP.length)add('info','Fixe un prix de vente pour '+noP.slice(0,2).join(', '),'Sans prix de vente, je ne peux pas calculer ta marge ni ton bénéfice.');
    if(slow.length)add('warn',slow.slice(0,2).join(', ')+' ne se vend pas','Reçu depuis plus de 2 semaines et rien de vendu. Baisse un peu le prix, fais une promo ou publie-le chaque jour avant de racheter.');
    if(base>0&&tt.frozen>base*.5)add('warn','Beaucoup d\'argent bloqué en stock : '+fmt(tt.frozen),'C\'est plus de la moitié de ton revenu du mois. Vends ce stock avant de recommander.');
    else if(tt.frozen>0)add('info','Argent en stock : '+fmt(tt.frozen),'Cet argent revient quand tu vends. Note chaque vente pour suivre ton bénéfice.');
    if(tt.profit>0)add('ok','Ton import rapporte','Bénéfice réalisé : '+fmt(tt.profit)+' sur '+fmt(tt.rev)+' de ventes. Remets une partie dans un nouvel achat et garde le reste.');
  }

  /* sauvegarde */
  if(!window.claude&&(stk.length||m.tx.length)){
    var lb=nfGet('suivi:lastbackup'),dsb=lb?Math.round((parse(t)-parse(lb))/864e5):999;
    if(dsb>=30)add('info',lb?'Dernière sauvegarde il y a '+dsb+' jours':'Fais une sauvegarde de tes données','Tes données sont seulement sur ce téléphone. Va dans Coach, section Sauvegarde, pour en garder une copie.');
  }

  /* habitudes */
  var hs=a.habits;
  if(hs.length){
    var done7=0,best=null,lostList=[];
    hs.forEach(function(h){
      var d7=0,j;
      for(j=0;j<7;j++)if(h.log[addDays(t,-j)])d7++;
      done7+=d7;
      var st=streak(h);
      if(!best||st>best.st)best={n:h.n,st:st};
      var sinceH=-1;
      for(j=0;j<14;j++)if(h.log[addDays(t,-j)]){sinceH=j;break}
      if(sinceH>=3&&sinceH<14)lostList.push(h);
    });
    var r=done7/(hs.length*7);
    if(r>=.7)add('ok','Tes habitudes sont régulières','Tu as fait '+pctS(r)+' de tes habitudes ces 7 derniers jours.'+(best&&best.st>=3?' Meilleure série : '+best.n+' ('+best.st+' jours).':''));
    else if(r<.35)add('warn','Tes habitudes sont en baisse','Seulement '+pctS(r)+' de tes habitudes ces 7 derniers jours. Choisis-en une seule à tenir demain.');
    else add('info','Habitudes à '+pctS(r)+' sur 7 jours','Un peu irrégulier. Cocher dès que tu as fini aide à tenir.');
    if(lostList.length)add('warn','Tu as lâché : '+lostList.map(function(h){return h.n}).slice(0,2).join(', '),'Plus de 3 jours sans cocher. Reprends aujourd\'hui, même une version courte.');
  }

  /* journée */
  var yd=day(addDays(t,-1)),carry=yd?yd.tasks.filter(function(x){return !x.d&&!x.c}).length:0;
  if(carry)add('info',carry+' tâche'+(carry>1?'s':'')+' d\'hier non terminée'+(carry>1?'s':''),'Reprends-les dans l\'onglet Jour avec le bouton prévu, ou supprime-les si elles ne comptent plus.');
  var td=day(t),tk=td?td.tasks:[];
  if(tk.length&&tk.every(function(x){return x.d}))add('ok','Toutes tes priorités du jour sont faites','Bravo. Prends un moment pour noter ce que tu as accompli ce soir.');
  else if(!tk.length&&now.getHours()>=9)add('info','Aucune priorité notée aujourd\'hui','Note 3 choses à finir aujourd\'hui. Une journée sans priorité file vite.');
  var moods=[];
  for(var k=0;k<7;k++){var rd=day(addDays(t,-k));if(rd&&rd.mood)moods.push(rd.mood)}
  if(moods.length>=3){
    var av=moods.reduce(function(s,x){return s+x},0)/moods.length;
    if(av<=2.2)add('warn','Ton humeur est basse cette semaine','Moyenne de '+av.toFixed(1)+' sur 5. Vérifie ton sommeil et ton rythme, et parle à quelqu\'un de proche si ça dure.');
    else if(av>=4)add('ok','Ton moral est bon cette semaine','Moyenne de '+av.toFixed(1)+' sur 5.');
  }

  /* projets */
  var ps=a.projects;
  if(ps.length){
    var inprog=ps.filter(function(p){return p.stage===2}),ideas=ps.filter(function(p){return p.stage===0}),prep=ps.filter(function(p){return p.stage===1});
    if(!inprog.length){
      var pick=prep[0]||ideas[0];
      if(pick)add('warn','Aucun projet n\'est en cours','Tu as '+ideas.length+' idée'+(ideas.length>1?'s':'')+' mais rien ne démarre. Choisis un seul projet, par exemple « '+pick.n+' », et fais-en le premier pas cette semaine.');
    }else if(inprog.length>2)add('warn',inprog.length+' projets en cours en même temps','Tu disperses ton énergie. Garde 2 projets au maximum et mets les autres en pause.');
    else add('ok','Tes projets avancent','En cours : '+inprog.map(function(p){return p.n}).slice(0,2).join(', ')+'.');
    var nonext=ps.filter(function(p){return p.stage<3&&!(p.next||'').trim()});
    if(nonext.length)add('warn',nonext.length+' projet'+(nonext.length>1?'s':'')+' sans prochaine étape','« '+nonext[0].n+' »'+(nonext.length>1?' et '+(nonext.length-1)+' autre'+(nonext.length>2?'s':''):'')+'. Un projet sans prochaine étape ne bouge pas. Écris l\'action concrète suivante.');
    if(ideas.length>=5)add('info','Beaucoup d\'idées en attente ('+ideas.length+')','Trie : supprime celles qui ne te motivent plus et passe la meilleure en Prépa.');
    var launched=ps.filter(function(p){return p.stage===3}).length;
    if(launched)add('ok',launched+' projet'+(launched>1?'s':'')+' lancé'+(launched>1?'s':''),'Bien. Pense à regarder ce que chacun rapporte dans ton budget.');
  }else add('info','Aucun projet suivi','Ajoute tes idées dans l\'onglet Projets pour que je puisse t\'aider à choisir par où commencer.');

  var bad=items.filter(function(x){return x.l==='bad'}).length,warn=items.filter(function(x){return x.l==='warn'}).length;
  var score=Math.max(8,Math.min(100,100-bad*22-warn*9));
  return {items:items,score:score,alerts:bad+warn,bad:bad,warn:warn,ok:items.filter(function(x){return x.l==='ok'}).length,
    base:base,dep:dep,reste:reste,dn:dn,dim:dim,byCat:byCat,inc:inc};
}

function aiShim(){
  var u=nfGet('suivi:aiurl');if(!u)return null;
  function err(c,m){var x=new Error(c);x.code=c;x.msg=m;return x}
  var f=async function(prompt,o,mode){
    var r;
    try{r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:prompt,mode:mode||'text'}),signal:o&&o.signal})}
    catch(e){if(e&&e.name==='AbortError')throw err('cancelled');throw err('net','Le serveur est introuvable. Vérifie l\'adresse enregistrée, ou ta connexion.')}
    if(r.status===429)throw err('rate_limited','Trop d\'essais. Réessaie plus tard.');
    if(r.status===404)throw err('http','Adresse incorrecte : le serveur n\'existe pas à cette adresse.');
    if(r.status===403)throw err('http','Le serveur refuse la demande. Vérifie que l\'adresse est la bonne.');
    if(r.status===500)throw err('http','Le serveur n\'a pas d\'IA. Sur Cloudflare, ajoute « Workers AI » avec le nom AI dans Bindings.');
    if(!r.ok){var dt='';try{dt=(await r.json()).detail||''}catch(e){}throw err('http','Le serveur n\'a pas reçu de réponse de l\'IA.'+(dt?' Détail : '+dt:' Réessaie.'))}
    return r.json();
  };
  var g=function(prompt,o){return f(prompt,o,'text')};
  g.json=async function(prompt,o){var j=await f(prompt,o,'json');return j.out};
  return g;
}

  var A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(12)),o='',i;

    del.forEach(function(x){localStorage.removeItem(x)});

/* ---------- bottom bar: slide to choose, hide on scroll ---------- */
var navEl=document.querySelector('.nav'),lastScrub=0,scrubbing=false;
function showNav(){navEl.classList.remove('hide');document.body.classList.remove('nav-off')}
function hideNav(){if(scrubbing)return;navEl.classList.add('hide');document.body.classList.add('nav-off')}
(function(){
  var lastY=window.scrollY||0,acc=0,tick=false;
  function upd(){
    tick=false;
    var y=Math.max(0,window.scrollY||0),d=y-lastY;lastY=y;
    if(!d)return;
    if((d>0)!==(acc>0))acc=0;
    acc+=d;
    if(y<60||acc<-24)showNav();
    else if(acc>48)hideNav();
  }
  window.addEventListener('scroll',function(){if(!tick){tick=true;requestAnimationFrame(upd)}},{passive:true});
})();
(function(){
  var navIn=document.getElementById('navin');
  var btns=Array.prototype.slice.call(navIn.querySelectorAll('button[data-v]'));
  var n=btns.length,pad=6,pid=null,hot=-1;
  function follow(x){
    var r=navIn.getBoundingClientRect(),w=(r.width-pad*2)/n;
    var f=(x-(r.left+pad))/w-.5;
    f=Math.max(0,Math.min(n-1,f));
    navIn.style.setProperty('--i',f.toFixed(3));
    var i=Math.max(0,Math.min(n-1,Math.round(f)));
    if(i!==hot){
      hot=i;
      btns.forEach(function(b,k){b.classList.toggle('hot',k===i)});
      document.body.setAttribute('data-tab',btns[i].dataset.v);
      try{if(navigator.vibrate)navigator.vibrate(8)}catch(e){}
    }
  }
  navIn.addEventListener('pointerdown',function(e){
    if(e.pointerType==='mouse'&&e.button!==0)return;
    pid=e.pointerId;scrubbing=true;showNav();
    navIn.classList.add('scrub');
    try{navIn.setPointerCapture(pid)}catch(_){}
    follow(e.clientX);
  });
  navIn.addEventListener('pointermove',function(e){if(e.pointerId===pid)follow(e.clientX)});
  function end(e,commit){
    if(e.pointerId!==pid)return;
    pid=null;scrubbing=false;
    navIn.classList.remove('scrub');
    var i=hot;
    btns.forEach(function(b){b.classList.remove('hot')});
    hot=-1;lastScrub=Date.now();
    if(commit&&i>=0)ACTS.tab({dataset:{v:btns[i].dataset.v}});
    else{
      document.body.setAttribute('data-tab',ui.tab);
      navIn.style.setProperty('--i',TABS.indexOf(ui.tab));
    }
  }
  navIn.addEventListener('pointerup',function(e){end(e,true)});
  navIn.addEventListener('pointercancel',function(e){end(e,false)});
})();

/* 3D tilt on the hero card */
(function(){
  if(REDUCED)return;
  var cur=null;
  function reset(){if(cur){cur.style.rotate='';cur=null}}
  main.addEventListener('pointermove',function(e){
    var h=e.target.closest&&e.target.closest('.hero');
    if(!h){reset();return}
    cur=h;
    var r=h.getBoundingClientRect();
    var nx=((e.clientX-r.left)/r.width-.5)*2,ny=((e.clientY-r.top)/r.height-.5)*2;
    var deg=Math.min(1,Math.hypot(nx,ny))*7;
    h.style.rotate=(-ny).toFixed(3)+' '+nx.toFixed(3)+' 0 '+deg.toFixed(2)+'deg';
  });
  main.addEventListener('pointerleave',reset);
  main.addEventListener('pointerup',reset);
  main.addEventListener('pointercancel',reset);
})();
